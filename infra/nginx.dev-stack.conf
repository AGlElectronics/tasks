# Used by the tasks-dev profile in the root suite docker-compose (service
# name tasks-dev-backend). Same as nginx.stack.conf but for the dev copy.
# Re-resolve the backend through Docker DNS: a cached IP goes stale when the
# backend container is recreated and may then belong to another module.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream tasks_dev_backend {
    zone tasks_dev_backend 64k;
    server tasks-dev-backend:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Security headers (TASK-40) come from the shared snippet, included in
    # every location that serves the app; the backend sets its own on /api/.

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://tasks_dev_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /livez {
        proxy_pass http://tasks_dev_backend/livez;
    }
    location = /readyz {
        proxy_pass http://tasks_dev_backend/readyz;
    }

    # Installation settings of the web app (sign-in address and the like),
    # mounted at /etc/conservices. Never cached, so a change shows on reload.
    location = /config.json {
        alias /etc/conservices/config.json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
