upstream tasks_backend {
    # Container-internal port is :8080 for every module in this ecosystem.
    # Host-side mapping (host:8160 -> container:8080) lives in docker-compose.yml.
    server backend:8080;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # JSON bodies are capped at 1MB by the backend; 20m leaves headroom for
    # the attachment upload route, which streams through the backend to S3.
    client_max_body_size 20m;

    # Security headers (TASK-40) come from the shared snippet
    # (infra/security-headers.conf.template), included in every location
    # that serves the app. Not at server level and not in /api/: the
    # backend sends its own, stricter API headers.

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy — the SPA calls /api/... relative so the same
    # origin serves both static assets and the API; avoids CORS in prod.
    # Unbuffered so the live-update stream (/api/v1/stream, SSE) flows.
    location /api/ {
        proxy_pass http://tasks_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Liveness / readiness pass through so orchestrator probes can target
    # the frontend origin and still reach the backend without exposing a
    # separate port.
    location = /livez {
        proxy_pass http://tasks_backend/livez;
    }
    location = /readyz {
        proxy_pass http://tasks_backend/readyz;
    }

    # Installation settings of the web app (sign-in address and the like),
    # mounted at /etc/conservices. Never cached, so a change shows on reload.
    location = /config.json {
        alias /etc/conservices/config.json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Hidden iframe target for oidc-client-ts silent renew. This one page
    # may be framed by the app itself; every other response stays unframeable.
    location = /silent-callback.html {
        include /etc/nginx/snippets/security-headers-frame-self.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback. Every unknown path returns index.html so TanStack
    # Router's client-side routes resolve on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
