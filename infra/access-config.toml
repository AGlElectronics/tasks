# Tasks access configuration.
#
# This TOML file is the single source of truth for the role → permission
# catalog and the OIDC-group → role bindings. It is read once at startup;
# restart the backend after editing.
#
# Permission reference — add new names in internal/domain/domain.go,
# otherwise the loader rejects them.
#
#   Spaces:     space.manage (every space)   space.create (new spaces, manage own)
#   Settings:   settings.manage (Den pairing, module settings)
#
# A role listed here replaces its built-in permission set entirely.
#
# Working on tasks is NOT a role: access to a space or a list comes from
# sharing (the space's "everyone" level, or per-user and per-group grants
# made in the app). There is deliberately no "tasks-user" group. The roles
# below only govern creating spaces and administering the module.

# Organization (slug) that bindings grant roles in, unless a binding sets
# its own `organization`.
organization = "demo-org"

# -------------------------------------------------------------------------
# Roles
# -------------------------------------------------------------------------

[roles.organization_admin]
description = "Manages every space, its lists and statuses, and the module settings."
permissions = [
  "space.manage",
  "space.create",
  "settings.manage",
]

[roles.space_creator]
description = "Creates new spaces and manages the spaces they created."
permissions = [
  "space.create",
]

# -------------------------------------------------------------------------
# OIDC group → role bindings (organization-wide, evaluated per request:
# removing someone from the group revokes the role on their next request)
# -------------------------------------------------------------------------

[[bindings]]
group = "tasks-admin"
role = "organization_admin"

[[bindings]]
group = "tasks-creator"
role = "space_creator"
